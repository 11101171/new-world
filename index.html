<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习笔记导航</title>
<style>
  :root{
    --bg:#0d1117;
    --card:#151b23;
    --border:#2a3139;
    --text:#e6edf3;
    --muted:#9aa4af;
    --accent:#58a6ff;
    --accent2:#79c0ff;
    --tag-bg:#1f2937;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  header{
    padding:48px 24px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 8px;
    font-size:26px;
    color:#fff;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:16px 16px 80px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.entry{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.entry:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
  }
  .icon{
    flex-shrink:0;
    width:44px;height:44px;
    border-radius:10px;
    background:var(--tag-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
  .meta{
    flex:1;
    min-width:0;
  }
  .meta h2{
    margin:0 0 4px;
    font-size:16px;
    color:#fff;
  }
  .meta p{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .arrow{
    color:var(--accent2);
    font-size:18px;
    flex-shrink:0;
  }
  .empty-hint{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:30px 10px;
    border:1px dashed var(--border);
    border-radius:12px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:10px 20px 30px;
  }
</style>
</head>
<body>

<header>
  <h1>学习笔记导航</h1>
  <p>点击下方卡片进入对应页面</p>
</header>

<div class="wrap">

  <a class="entry" href="Go注意.html">
    <div class="icon">📘</div>
    <div class="meta">
      <h2>Go 注意事项汇总</h2>
      <p>语言设计 · 并发与内存模型 · Goroutine 实战踩坑（21 条）</p>
    </div>
    <div class="arrow">→</div>
  </a>

  <!--
    以后新增页面，复制一份上面的 <a class="entry">...</a> 块，
    把 href 换成新文件名，把标题和描述改掉即可。

    示例：
    <a class="entry" href="another-page.html">
      <div class="icon">📗</div>
      <div class="meta">
        <h2>新页面标题</h2>
        <p>一句话描述</p>
      </div>
      <div class="arrow">→</div>
    </a>
  -->

</div>

<footer>把新的 HTML 文件放在同一目录下，并在上面加一张卡片即可收录</footer>

</body>
</html>
